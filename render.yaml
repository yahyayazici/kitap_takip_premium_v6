services:
  - type: web
    name: kitap-takip-premium-v6
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --timeout 120"
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: PANEL_NAME
        value: "Kitap Takip Premium"
      - key: PANEL_SHORT
        value: "Kitap Takip Premium"
      - key: PANEL_MOBILE_SHORT
        value: "Kitap Premium"
      - key: PANEL_ORG
        value: "Kitap Takip Premium"
      - key: PANEL_FOOTER
        value: "Kitap Takip Premium"
      - key: PANEL_MODULE_LABEL
        value: "Eğitim Modülü"
      - key: PANEL_PUBLIC_URL
        value: "https://kitap-takip-premium-v6.onrender.com"
      - key: RUN_SEED_WAVE0
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: kitap-takip-db
          property: connectionString

databases:
  - name: kitap-takip-db
    plan: free
