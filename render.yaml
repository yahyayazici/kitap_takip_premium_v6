services:
  - type: web
    name: cinili-saray-proje
    runtime: python
    plan: starter
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 60 --preload"
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: PANEL_NAME
        value: "Çinili Saray Proje"
      - key: PANEL_SHORT
        value: "Çinili Saray Proje"
      - key: PANEL_MOBILE_SHORT
        value: "Çinili Saray"
      - key: PANEL_ORG
        value: "Çinili Saray Proje"
      - key: PANEL_FOOTER
        value: "Çinili Saray Proje"
      - key: PANEL_MODULE_LABEL
        value: "Eğitim Modülü"
      - key: PANEL_PUBLIC_URL
        value: "https://cinilisarayproje.com"
      - key: RUN_SEED_WAVE0
        value: "false"
      - key: CUSTOM_DOMAIN
        value: "cinilisarayproje.com,www.cinilisarayproje.com"
      - key: CANONICAL_HOST
        value: "cinilisarayproje.com"
      - key: DATABASE_URL
        fromDatabase:
          name: kitap-takip-db
          property: connectionString

databases:
  - name: kitap-takip-db
    plan: basic-256mb
