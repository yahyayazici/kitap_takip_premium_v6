services:
  - type: web
    name: cinili-saray-proje
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/
    # Özel alan adları. MEVCUT İKİSİ DE burada yazılı olmalı: Render bu listeyi
    # olduğu gibi uygular, eksik bırakılan bir alan adı servisten düşebilir.
    domains:
      - cinilisarayproje.com
      - www.cinilisarayproje.com
      - ekran.cinilisarayproje.com
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: PANEL_NAME
        value: "Çinili Saray Proje"
      - key: PANEL_SHORT
        value: "Çinili Saray Proje"
      - key: PANEL_MOBILE_SHORT
        value: "Çinili Saray"
      - key: PANEL_ORG
        value: "Çinili Saray Proje"
      - key: PANEL_FOOTER
        value: "Çinili Saray Proje"
      - key: PANEL_MODULE_LABEL
        value: "Eğitim Modülü"
      - key: PANEL_PUBLIC_URL
        value: "https://cinilisarayproje.com"
      - key: RUN_SEED_WAVE0
        value: "false"
      - key: CUSTOM_DOMAIN
        value: "cinilisarayproje.com,www.cinilisarayproje.com"
      - key: CANONICAL_HOST
        value: "cinilisarayproje.com"
      # Dijital Duyuru Ekranı alt alan adı — Render Custom Domains'e de eklenmeli
      - key: EKRAN_HOST
        value: "ekran.cinilisarayproje.com"
      # Ekran modülünün PDF/görsel/videoları aşağıdaki kalıcı diske yazılır;
      # böylece her deploy'da silinmezler.
      - key: EKRAN_MEDIA_ROOT
        value: "/var/ekran-medya"
      # Akıllı Tahta Dosya Merkezi'nin dosyaları da AYNI kalıcı diskin bir alt
      # klasörüne yazılır (yeni disk gerekmez). Bu ayar olmadan dosyalar
      # container'ın geçici diskine yazılır ve her deploy'da silinir.
      - key: AKILLI_TAHTA_MEDIA_ROOT
        value: "/var/ekran-medya/akilli-tahta-medya"
      - key: DATABASE_URL
        fromDatabase:
          name: kitap-takip-db
          property: connectionString
    # Kalıcı disk — televizyonlara gönderilen medya burada durur.
    # Disk bağlı bir servis tek örnekle çalışır (Starter planında zaten öyle).
    disk:
      name: ekran-medya
      mountPath: /var/ekran-medya
      sizeGB: 10

databases:
  - name: kitap-takip-db
    plan: basic-256mb
