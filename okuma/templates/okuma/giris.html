{% extends "okuma/base.html" %}
{% block baslik %}Giriş{% endblock %}
{% block govde %}
<div class="giris">
  <div class="giris-kutu">
    <div class="simge"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="2" fill="#fff"/><circle cx="12.5" cy="8" r="2" stroke="#fff" stroke-width="1.4"/><circle cx="17" cy="8" r="2" stroke="#fff" stroke-width="1.4"/><circle cx="8" cy="13.5" r="2" stroke="#fff" stroke-width="1.4"/><circle cx="12.5" cy="13.5" r="2" fill="#fff"/><circle cx="17" cy="13.5" r="2" stroke="#fff" stroke-width="1.4"/><path d="M7 19h10" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg></div>
    <h1>Giriş yapın.</h1>
    <p>{{ KURUM_ADI }} deneme okuma ve analiz paneli</p>
    {% if form.errors %}<ul class="bildirimler"><li class="error">Kullanıcı adı veya şifre hatalı.</li></ul>{% endif %}
    <form method="post">{% csrf_token %}
      <div class="alan"><label for="id_username">Kullanıcı adı</label>{{ form.username }}</div>
      <div class="alan"><label for="id_password">Şifre</label>{{ form.password }}</div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn buyuk">Giriş yap</button>
    </form>
  </div>
</div>
{% endblock %}
