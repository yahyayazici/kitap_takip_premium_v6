{% load static %}
<!doctype html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teşekkürler · {{ panel_org }}</title>
    <link rel="stylesheet" href="{% static 'css/sinav-basvuru.css' %}">
    <link rel="stylesheet" href="{% static 'css/veli-anketi.css' %}">
</head>
<body>
<main class="sb-page sb-thanks">
    <div class="sb-shell">
        <header class="sb-brand">
            <div class="sb-logo">
                <img src="{% static 'images/cinili-saray-logo-transparent.png' %}" alt="Çinili Saray Öğrenci Yurdu">
            </div>
            <p>{{ anket_baslik }}</p>
        </header>

        <section class="sb-panel">
            <div class="va-thanks-check" aria-hidden="true">✓</div>
            <p class="sb-eyebrow">Anket tamam</p>
            <h2>Teşekkür ederiz!</h2>
            <p class="sb-lead">Değerlendirmeniz başarıyla kaydedildi. Geri bildiriminiz bizim için çok değerli.</p>
        </section>
    </div>
</main>
</body>
</html>
