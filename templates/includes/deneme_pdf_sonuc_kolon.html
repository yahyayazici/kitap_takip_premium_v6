<table class="results{% if kompakt %} results-kompakt{% endif %}">
    <colgroup>
        <col class="col-sira">
        <col class="col-ad">
        <col class="col-num">
        <col class="col-num">
        <col class="col-num">
        <col class="col-num">
        <col class="col-num">
    </colgroup>
    <thead>
        <tr>
            <th>Sıra</th>
            <th class="left">Talebe</th>
            <th>D</th>
            <th>Y</th>
            <th>B</th>
            <th>Net</th>
            <th>Puan</th>
        </tr>
    </thead>
    <tbody>
        {% for sonuc in kolon %}
        <tr>
            <td><span class="rank-no">{{ forloop.counter|add:sira_offset }}</span></td>
            <td class="left">
                <div class="student-name">{{ sonuc.talebe.ad_soyad }}</div>
            </td>
            <td class="num-cell">{{ sonuc.toplam_dogru }}</td>
            <td class="num-cell">{{ sonuc.toplam_yanlis }}</td>
            <td class="num-cell">{{ sonuc.toplam_bos }}</td>
            <td class="num-cell">{{ sonuc.toplam_net }}</td>
            <td class="num-cell puan-cell">{{ sonuc.puan }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="7" class="left" style="padding:8px;">—</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
