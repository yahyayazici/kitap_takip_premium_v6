<div class="asistan-root" id="asistan-root">
    <button type="button" class="asistan-fab" id="asistan-fab" aria-label="Panel asistanını aç" aria-expanded="false" aria-controls="asistan-panel">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3C7.03 3 3 6.58 3 11c0 2.02.9 3.84 2.36 5.17L4 21l4.53-1.18A10.8 10.8 0 0 0 12 19c4.97 0 9-3.58 9-8s-4.03-8-9-8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <circle cx="8.5" cy="11" r="1" fill="currentColor"/>
            <circle cx="12" cy="11" r="1" fill="currentColor"/>
            <circle cx="15.5" cy="11" r="1" fill="currentColor"/>
        </svg>
    </button>

    <div class="asistan-panel" id="asistan-panel" role="dialog" aria-label="Panel asistanı">
        <div class="asistan-head">
            <div>
                <strong>Panel Asistanı</strong>
                <small>Sohbet edin, rapor ve PDF isteyin</small>
            </div>
            <button type="button" class="asistan-close" id="asistan-close" aria-label="Kapat">×</button>
        </div>
        <div class="asistan-body">
            <div class="asistan-messages" id="asistan-messages"></div>
            <div class="asistan-typing" id="asistan-typing" hidden>Yanıt hazırlanıyor…</div>
        </div>
        <div class="asistan-footer">
            <div class="asistan-suggestions" id="asistan-suggestions"></div>
            <form class="asistan-form" id="asistan-form" data-api-url="{% url 'asistan_chat_api' %}">
                {% csrf_token %}
                <input type="text" class="asistan-input" id="asistan-input" placeholder="Sohbet edin veya rapor isteyin…" autocomplete="off">
                <button type="submit" class="asistan-send" aria-label="Gönder">→</button>
            </form>
        </div>
    </div>
</div>
