{% load static %}
<meta name="theme-color" content="#071b3a">
<style>
a,button,summary,[role="button"],.v3-nav-link,.v3-nav-trigger,.v3-menu-toggle,.primary-btn,.ghost-btn,.book-action-btn{
    touch-action:manipulation;
}
.cs-instant-bar{
    position:fixed;
    left:0;
    top:0;
    height:3px;
    width:100%;
    transform:scaleX(0);
    transform-origin:left;
    background:var(--cs-primary);
    z-index:2147483000;
    pointer-events:none;
    opacity:0;
}
.cs-instant-bar.is-on{
    opacity:1;
    transform:scaleX(.72);
    transition:transform .18s ease;
}
.cs-instant-bar.is-done{
    opacity:0;
    transform:scaleX(1);
    transition:transform .12s ease, opacity .18s ease;
}
html.cs-nav-on,
html.cs-nav-on body{
    cursor:progress;
}
button.is-saving,
input.is-saving,
tr.is-saving{
    cursor:progress;
}
tr.is-saving{
    opacity:.55;
}
@media (max-width:1400px){
    .v3-nav-backdrop{transition:none!important}
    .cs-nav-arming a,
    .cs-nav-arming .v3-nav-trigger{
        pointer-events:none!important;
    }
}
</style>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="{{ panel_mobile_short|default:panel_short }}">
<meta name="application-name" content="{{ panel_mobile_short|default:panel_short }}">
<link rel="manifest" href="{% url 'web_manifest' %}?v=14">
<link rel="apple-touch-icon" sizes="180x180" href="{% url 'pwa_icon_180' %}?v=14">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="{% url 'pwa_icon_180' %}?v=14">
<link rel="icon" type="image/png" sizes="192x192" href="{% url 'pwa_icon_192' %}?v=14">
<link rel="icon" type="image/png" sizes="512x512" href="{% url 'pwa_icon_512' %}?v=14">
<script src="{% static 'js/pwa-install.js' %}?v=14" defer></script>
<script src="{% static 'js/cs-mobile-snap.js' %}?v=17" defer></script>
<script src="{% static 'js/cs-instant.js' %}?v=3" defer></script>
