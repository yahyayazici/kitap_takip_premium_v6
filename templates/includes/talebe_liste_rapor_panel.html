{% load static %}
{% load filter_tags %}
<link rel="stylesheet" href="{% static 'css/talebe-rapor.css' %}?v=tr1">
<div class="talebe-rapor-wrap">
    <button type="button" class="ghost-btn talebe-rapor-ac" aria-expanded="false" aria-controls="talebe-rapor-panel">
        Rapor Al
    </button>
    <div class="talebe-rapor-panel" id="talebe-rapor-panel" hidden>
        <div class="talebe-rapor-card">
            <strong>Sınıf Bazlı Liste</strong>
            <p>Bir veya birden fazla sınıf seçerek talebe isim listesi PDF'i alın.</p>
            <form method="get" action="{{ rapor_pdf_url }}" target="_blank" class="talebe-rapor-form">
                <input type="hidden" name="tur" value="sinif">
                <label class="talebe-rapor-label" for="talebe-rapor-sinif">Sınıf</label>
                <select id="talebe-rapor-sinif" name="sinif_sube" class="talebe-rapor-select ms-filter" multiple data-placeholder="Sınıf seçin">
                    {% for sinif in rapor_siniflar %}
                    <option value="{{ sinif.id }}">{{ sinif.sinif }}-{{ sinif.sube }}</option>
                    {% endfor %}
                </select>
                <button type="submit" class="primary-btn talebe-rapor-btn">PDF İndir</button>
            </form>
            <script>
            (function () {
                const form = document.querySelector('#talebe-rapor-panel .talebe-rapor-form');
                if (!form) return;
                form.addEventListener('submit', function (event) {
                    const select = form.querySelector('select[name="sinif_sube"]');
                    const secili = select && Array.from(select.selectedOptions).some(function (o) { return o.value; });
                    if (!secili) {
                        event.preventDefault();
                        alert('En az bir sınıf seçin.');
                    }
                });
            })();
            </script>
        </div>

        {% if kurum_raporu_goster %}
        <div class="talebe-rapor-card">
            <strong>Kurum Geneli Liste</strong>
            <p>Tüm sınıflar kendi başlığı altında, yalnızca isimler.</p>
            <a href="{{ rapor_pdf_url }}?tur=kurum" target="_blank" rel="noopener" class="primary-btn talebe-rapor-btn talebe-rapor-link">
                PDF İndir
            </a>
        </div>
        {% endif %}
    </div>
</div>

<script>
(function () {
    if (window.__talebeRaporMenu) return;
    window.__talebeRaporMenu = true;

    function closeAll() {
        document.querySelectorAll('.talebe-rapor-panel').forEach(function (panel) {
            panel.setAttribute('hidden', '');
        });
        document.querySelectorAll('.talebe-rapor-ac').forEach(function (btn) {
            btn.setAttribute('aria-expanded', 'false');
        });
        document.body.classList.remove('talebe-rapor-open');
    }

    function place(panel, ac) {
        var rect = ac.getBoundingClientRect();
        var width = Math.min(380, window.innerWidth - 24);
        var left = rect.right - width;
        if (left < 12) left = 12;
        if (left + width > window.innerWidth - 12) left = window.innerWidth - width - 12;
        var top = rect.bottom + 8;
        panel.style.width = width + 'px';
        var height = panel.offsetHeight || 280;
        if (top + height > window.innerHeight - 12 && rect.top - height - 8 > 12) {
            top = rect.top - height - 8;
        }
        panel.style.top = Math.max(12, top) + 'px';
        panel.style.left = left + 'px';
    }

    document.querySelectorAll('.talebe-rapor-wrap').forEach(function (wrap) {
        var ac = wrap.querySelector('.talebe-rapor-ac');
        var panel = wrap.querySelector('.talebe-rapor-panel');
        if (!ac || !panel || wrap.dataset.raporBound) return;
        wrap.dataset.raporBound = '1';

        if (window.initMultiSelectFilters) {
            window.initMultiSelectFilters(wrap);
        }

        ac.addEventListener('click', function (event) {
            event.stopPropagation();
            var willOpen = panel.hasAttribute('hidden');
            closeAll();
            if (!willOpen) return;
            document.body.appendChild(panel);
            panel.removeAttribute('hidden');
            ac.setAttribute('aria-expanded', 'true');
            place(panel, ac);
        });

        window.addEventListener('resize', function () {
            if (!panel.hasAttribute('hidden')) place(panel, ac);
        });
    });

    document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') closeAll();
    });
    document.addEventListener('click', function (event) {
        if (event.target.closest('.talebe-rapor-wrap')) return;
        if (event.target.closest('.talebe-rapor-panel')) return;
        if (event.target.closest('.ms-filter-panel')) return;
        closeAll();
    });
})();
</script>
