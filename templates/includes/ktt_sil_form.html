{% if silebilir %}
<form method="post" action="{% url 'ktt_sil' ktt.pk %}"{% if form_style %} style="{{ form_style }}"{% endif %} onsubmit="return confirm('{{ ktt.ad|escapejs }} silinsin mi? Bu işlem geri alınamaz.');">
    {% csrf_token %}
    <button type="submit" class="{{ btn_class|default:'ktt-btn ktt-btn-red' }}{% if ikon %} ktt-btn-icon{% endif %}"{% if ikon %} aria-label="Sil"{% endif %}>{% if ikon %}<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M8 7l1 12h6l1-12"/></svg>{% else %}Sil{% endif %}</button>
</form>
{% endif %}
