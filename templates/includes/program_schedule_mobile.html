<div class="pg-mob-flow" aria-label="Günlük program akışı">
    {% for satir in satirlar %}
    <article class="pg-mob-item pg-flow-renk-{{ satir.tur_renk }}">
        <div class="pg-mob-rail" aria-hidden="true">
            <span class="pg-mob-dot"></span>
            {% if not forloop.last %}<span class="pg-mob-line"></span>{% endif %}
        </div>
        <div class="pg-mob-card">
            <p class="pg-mob-time">{{ satir.baslangic_saati|time:"H:i" }} – {{ satir.bitis_saati|time:"H:i" }}</p>
            <h3 class="pg-mob-title">{{ satir.faaliyet_adi }}</h3>
            <p class="pg-mob-meta">
                <span class="pg-mob-tur">{{ satir.tur_etiket }}</span>
                <span class="pg-mob-sure">({{ satir.sure_dakika }} dk)</span>
            </p>
        </div>
    </article>
    {% empty %}
    <p class="pg-mob-empty">Program satırı yok.</p>
    {% endfor %}
</div>
