<svg class="duyuru-scene-svg" viewBox="0 0 400 320" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
    <defs>
        <linearGradient id="as-laptop" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
        <linearGradient id="as-screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#312e81"/></linearGradient>
        <linearGradient id="as-glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#60a5fa" stop-opacity="0.6"/><stop offset="100%" stop-color="#a78bfa" stop-opacity="0.2"/></linearGradient>
        <filter id="as-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.45"/></filter>
        <filter id="as-soft" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/></filter>
    </defs>
    <!-- Glow ring -->
    <ellipse cx="290" cy="150" rx="110" ry="90" stroke="url(#as-glow)" stroke-width="3" opacity="0.55"/>

    <ellipse cx="210" cy="268" rx="150" ry="18" fill="rgba(255,255,255,0.08)"/>
    <ellipse cx="210" cy="264" rx="120" ry="12" fill="rgba(96,165,250,0.15)"/>

    <g filter="url(#as-shadow)" transform="translate(118, 52)">
        <rect x="0" y="0" width="196" height="128" rx="10" fill="url(#as-laptop)"/>
        <rect x="8" y="8" width="180" height="104" rx="6" fill="url(#as-screen)"/>
        <!-- Sidebar -->
        <rect x="14" y="14" width="36" height="92" rx="4" fill="rgba(255,255,255,0.08)"/>
        <rect x="20" y="22" width="24" height="4" rx="2" fill="rgba(255,255,255,0.35)"/>
        <rect x="20" y="32" width="20" height="3" rx="1.5" fill="rgba(255,255,255,0.18)"/>
        <rect x="20" y="40" width="22" height="3" rx="1.5" fill="rgba(255,255,255,0.18)"/>
        <rect x="20" y="48" width="18" height="3" rx="1.5" fill="rgba(96,165,250,0.55)"/>
        <!-- Stats -->
        <rect x="58" y="14" width="52" height="28" rx="6" fill="rgba(255,255,255,0.12)"/>
        <rect x="64" y="20" width="22" height="6" rx="3" fill="#fff" opacity="0.85"/>
        <rect x="64" y="30" width="32" height="4" rx="2" fill="rgba(255,255,255,0.25)"/>
        <rect x="116" y="14" width="52" height="28" rx="6" fill="rgba(255,255,255,0.1)"/>
        <rect x="122" y="20" width="18" height="6" rx="3" fill="#93c5fd"/>
        <rect x="122" y="30" width="28" height="4" rx="2" fill="rgba(255,255,255,0.2)"/>
        <!-- Chart area -->
        <rect x="58" y="50" width="124" height="56" rx="6" fill="rgba(255,255,255,0.07)"/>
        <path d="M68 92 L88 78 L108 84 L128 68 L148 74 L168 58" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="168" cy="58" r="3.5" fill="#fff"/>
        <!-- Base -->
        <path d="M-12 128 H208 L196 140 H0 Z" fill="#334155"/>
    </g>
    <!-- Phone -->
    <g filter="url(#as-soft)" transform="translate(28, 88) rotate(-8)">
        <rect x="0" y="0" width="56" height="96" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.2)" stroke-width="1.2"/>
        <rect x="5" y="8" width="46" height="76" rx="4" fill="#1e3a8a"/>
        <rect x="10" y="14" width="36" height="5" rx="2.5" fill="#fff" opacity="0.8"/>

        <rect x="10" y="32" width="34" height="14" rx="4" fill="rgba(255,255,255,0.12)"/>
        <rect x="10" y="52" width="34" height="14" rx="4" fill="rgba(147,197,253,0.25)"/>
        <circle cx="28" cy="78" r="8" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
        <path d="M28 78 L28 72" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Chat assistant widget -->
    <g filter="url(#as-shadow)" transform="translate(268, 118)">

        <rect x="0" y="22" width="118" height="16" fill="url(#as-screen)"/>

        <rect x="28" y="22" width="36" height="3" rx="1.5" fill="rgba(255,255,255,0.45)"/>

        <rect x="10" y="48" width="72" height="28" rx="10" fill="#f1f5f9"/>
        <rect x="16" y="56" width="56" height="3" rx="1.5" fill="#94a3b8"/>
        <rect x="16" y="62" width="44" height="3" rx="1.5" fill="#cbd5e1"/>

        <rect x="36" y="82" width="72" height="22" rx="10" fill="#3b82f6"/>
        <rect x="44" y="90" width="48" height="3" rx="1.5" fill="rgba(255,255,255,0.85)"/>

        <rect x="10" y="114" width="98" height="24" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
        <circle cx="96" cy="126" r="8" fill="#3b82f6"/>
        <path d="M93 126 L98 126 M98 126 L96 124 M98 126 L96 128" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Floating cubes -->
    <rect x="312" y="36" width="14" height="14" rx="3" fill="rgba(255,255,255,0.18)" transform="rotate(15 319 43)"/>
    <rect x="48" y="48" width="10" height="10" rx="2" fill="rgba(255,255,255,0.12)" transform="rotate(-12 53 53)"/>
    <circle cx="340" cy="248" r="6" fill="rgba(167,139,250,0.45)"/>
    <circle cx="72" cy="228" r="4" fill="rgba(96,165,250,0.5)"/>
    <!-- Sparkle -->
    <path d="M354 72 L356 78 L362 80 L356 82 L354 88 L352 82 L346 80 L352 78 Z" fill="rgba(255,255,255,0.55)"/>
</svg>
