<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>{% block title %}Akıllı Tahta{% endblock %} · {{ panel_name }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
    :root {
        /* —— Renk: açık, ferah zemin + tek net kurumsal mavi vurgu —— */
        --at-bg-a: #f4f7ff;
        --at-bg-b: #eef1fc;
        --at-bg-c: #e7ecfb;
        --at-surface: #ffffff;
        --at-surface-2: #f6f8fe;
        --at-border: rgba(15, 23, 64, .08);
        --at-border-strong: rgba(15, 23, 64, .16);
        --at-text: #0f1730;
        --at-text-dim: #4c5578;
        --at-text-faint: #8a91b8;
        --at-accent: #2f5fe0;
        --at-accent-strong: #1c47c9;
        --at-accent-soft: rgba(47, 95, 224, .10);
        --at-accent-soft-border: rgba(47, 95, 224, .30);
        --at-violet: #7c6bf0;
        --at-cyan: #29c2e0;

        /* —— Yerleşim: sayfa boyunca aynı ölçüler —— */
        --at-gutter: clamp(22px, 4.5vw, 64px);
        --at-max: 1360px;
        --at-radius-lg: 18px;
        --at-radius-md: 12px;
        --at-radius-pill: 999px;
        --at-shadow-card: 0 1px 0 rgba(255, 255, 255, .8) inset, 0 14px 30px -18px rgba(15, 23, 64, .18), 0 2px 8px -3px rgba(15, 23, 64, .08);
        --at-shadow-card-hover: 0 1px 0 rgba(255, 255, 255, .9) inset, 0 30px 50px -22px rgba(15, 23, 64, .22), 0 0 0 1px var(--at-accent-soft-border);
    }
    * { box-sizing: border-box; }
    html, body {
        margin: 0; padding: 0; min-height: 100%;
        background: linear-gradient(165deg, var(--at-bg-a) 0%, var(--at-bg-b) 45%, var(--at-bg-c) 100%);
        color: var(--at-text);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }
    ::selection { background: var(--at-accent-soft); }
    :focus-visible { outline: 2px solid var(--at-accent); outline-offset: 2px; }

    .at-donus {
        position: fixed; left: var(--at-gutter); bottom: 20px; z-index: 999;
        display: inline-flex; align-items: center; gap: 8px;
        background: var(--at-surface); color: var(--at-text); border: 1px solid var(--at-border-strong);
        border-radius: var(--at-radius-pill); padding: 12px 20px 12px 16px;
        font-size: 14px; font-weight: 600; box-shadow: var(--at-shadow-card);
        transition: transform .15s ease, box-shadow .15s ease;
    }
    .at-donus:hover { transform: translateY(-1px); box-shadow: var(--at-shadow-card-hover); }

    @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; animation: none !important; }
    }
    {% block extra_style %}{% endblock %}
</style>
{% block extra_head %}{% endblock %}
</head>
<body>
{% block content %}{% endblock %}
{% block extra_body_end %}{% endblock %}
</body>
</html>
