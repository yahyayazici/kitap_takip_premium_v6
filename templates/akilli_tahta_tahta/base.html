<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>{% block title %}Akıllı Tahta{% endblock %} · {{ panel_name }}</title>
<style>
    :root {
        --at-bg: #0f172a;
        --at-panel: #1e293b;
        --at-panel-2: #273549;
        --at-accent: #3b82f6;
        --at-text: #f1f5f9;
        --at-muted: #94a3b8;
        --at-border: #334155;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: var(--at-bg); color: var(--at-text);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }
    .at-donus {
        position: fixed; left: 16px; bottom: 16px; z-index: 999;
        background: var(--at-accent); color: #fff; border: none; border-radius: 999px;
        padding: 14px 22px; font-size: 16px; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.4);
    }
    {% block extra_style %}{% endblock %}
</style>
{% block extra_head %}{% endblock %}
</head>
<body>
{% block content %}{% endblock %}
{% block extra_body_end %}{% endblock %}
</body>
</html>
