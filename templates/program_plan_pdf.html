{% load static %}
<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <title>{{ program.ad }} · Program</title>
    <style>
        @font-face {
            font-family: "Poppins";
            src: url("{% static 'fonts/Poppins-Regular.ttf' %}") format("truetype");
            font-weight: 400;
        }
        @font-face {
            font-family: "Poppins";
            src: url("{% static 'fonts/Poppins-Medium.ttf' %}") format("truetype");
            font-weight: 500;
        }
        @font-face {
            font-family: "Poppins";
            src: url("{% static 'fonts/Poppins-SemiBold.ttf' %}") format("truetype");
            font-weight: 600;
        }

        @page { size: {{ pdf_sayfa.size_css|default:"A4 portrait" }}; margin: 10mm 12mm; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Poppins", sans-serif;
            color: #1c2a3d;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .head { margin-bottom: 8px; }
        .head h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            color: #10213d;
            letter-spacing: -0.25px;
        }
        .head p {
            margin: 3px 0 0;
            font-size: 9px;
            color: #718097;
        }

        table.program {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        table.program th,
        table.program td {
            border: 1px solid #d5deea;
            padding: 0 12px;
            vertical-align: middle;
        }
        table.program th {
            background: #173b80;
            color: #ffffff;
            font-weight: 600;
            font-size: 10px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            height: 11mm;
        }
        table.program th.saat,
        table.program td.saat { width: 36%; text-align: center; }
        table.program td.saat {
            font-size: 14px;
            font-weight: 600;
            color: #173b80;
            font-variant-numeric: tabular-nums;
            background: #f4f7fb;
        }
        table.program td.faaliyet {
            font-size: 14px;
            font-weight: 500;
            color: #14213d;
        }
        {% if satirlar %}
        {% widthratio 255 satirlar|length 1 as satir_mm %}
        table.program tbody td { height: {{ satir_mm|default:12 }}mm; }
        {% endif %}
        .empty { color: #8b98aa; font-style: italic; padding: 12px; }
    </style>
</head>
<body>
    <div class="head">
        <h1>{{ program.ad }}</h1>
        <p>{{ program.tarih_araligi_goster }}</p>
    </div>

    <table class="program">
        <thead>
            <tr>
                <th class="saat">Saat</th>
                <th>Faaliyet</th>
            </tr>
        </thead>
        <tbody>
            {% for satir in satirlar %}
            <tr>
                <td class="saat">{{ satir.baslangic_saati|time:"H:i" }} – {{ satir.bitis_saati|time:"H:i" }}</td>
                <td class="faaliyet">{{ satir.faaliyet_adi }}</td>
            </tr>
            {% empty %}
            <tr><td colspan="2" class="empty">Program satırı tanımlanmamış.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
