{% extends "yonetim/base.html" %}

{% block title %}Ödeme Profili · {{ hoca.ad_soyad }}{% endblock %}

{% block content %}
<header class="page-head patterned-page-head yonetim-page-head">
    <div>
        <p class="kicker">FİNANS AYARI</p>
        <h1>{{ hoca.ad_soyad }}</h1>
        <p class="muted">Saatlik ücret ve branş bilgisi.</p>
    </div>
</header>

<section class="yonetim-form-card">
    <form method="post">
        {% csrf_token %}
        <div class="yonetim-field">
            <label for="{{ form.brans.id_for_label }}">Branş</label>
            {{ form.brans }}
        </div>
        <div class="yonetim-field">
            <label for="{{ form.saatlik_ucret.id_for_label }}">Saatlik Ücret (₺)</label>
            {{ form.saatlik_ucret }}
        </div>
        <div class="yonetim-field">
            <label>{{ form.aktif }} Aktif</label>
        </div>
        <div class="yonetim-form-actions">
            <a href="{% url 'yonetim:ogretmen_odeme_profil_listesi' %}" class="ghost-btn yonetim-head-ghost">Vazgeç</a>
            <button type="submit" class="primary-btn">Kaydet</button>
        </div>
    </form>
</section>
{% endblock %}
