{% extends "yonetim/base.html" %}
{% block title %}{{ baslik }}{% endblock %}
{% block content %}

<header class="page-head patterned-page-head yonetim-page-head">
    <div>
        <p class="kicker">AİDAT</p>
        <h1>{{ baslik }}</h1>
    </div>
    <div class="yonetim-page-head-actions">
        <a href="{% url 'yonetim:aidat_tanim_listesi' %}" class="ghost-btn yonetim-head-ghost">← Liste</a>
    </div>
</header>

<section class="dashboard-card yonetim-form-card">
    <div class="card-heading">
        <div>
            <p class="card-kicker">FORM</p>
            <h2>Aidat Tanımı</h2>
        </div>
    </div>
    <form method="post" class="yonetim-form-layout">
        {% csrf_token %}
        <div class="yonetim-form-grid">
            {% include "yonetim/includes/form_fields.html" %}
        </div>
        <div class="yonetim-form-actions">
            <button type="submit" class="primary-btn">Kaydet</button>
        </div>
    </form>
</section>

{% endblock %}
